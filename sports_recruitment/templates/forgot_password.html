{% extends "base.html" %}
{% block title %}Forgot Password — Sports Talent Platform{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="icon">🔐</div>
      <h2 data-i18n="pass.forgot">Forgot Password</h2>
      <p>Enter your email and we'll send a reset link.</p>
    </div>

    <form method="POST" action="{{ url_for('forgot_password') }}">
      <div class="form-group">
        <label class="form-label" for="email" data-i18n="auth.email">Email Address</label>
        <input class="form-control" type="email" id="email" name="email" required
               placeholder="your@email.com"/>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" data-i18n="pass.submit">Send Reset Link</button>
    </form>

    <div class="auth-footer">
      <a href="{{ url_for('login') }}" data-i18n="pass.backtologin">← Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
