{% extends "base.html" %}
{% block title %}Reset Password — Sports Talent Platform{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="icon">🔑</div>
      <h2 data-i18n="pass.reset">Reset Password</h2>
      <p>Enter your new password below.</p>
    </div>

    <form method="POST" action="{{ url_for('reset_password', token=token) }}">
      <div class="form-group">
        <label class="form-label" for="password" data-i18n="pass.newpass">New Password</label>
        <input class="form-control" type="password" id="password" name="password" required
               placeholder="Min. 6 characters" autocomplete="new-password"/>
        <div style="margin-top:6px;height:4px;background:var(--border);border-radius:4px;overflow:hidden">
          <div id="pwStrengthBar" style="height:100%;width:0;border-radius:4px;transition:width 0.3s,background 0.3s"></div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm_password" data-i18n="pass.confirm">Confirm New Password</label>
        <input class="form-control" type="password" id="confirm_password" name="confirm_password" required
               placeholder="Repeat new password" autocomplete="new-password"/>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" data-i18n="pass.resetbtn">Reset Password</button>
    </form>

    <div class="auth-footer">
      <a href="{{ url_for('login') }}" data-i18n="pass.backtologin">← Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
